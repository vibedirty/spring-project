server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: spring-java-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:spring-java-service.yaml?group=SERVICE_GROUP&refreshEnabled=true
  cloud:
    openfeign:
      sentinel:
        enabled: true
      client:
        config:
          account-service:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic
          cart-service:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:/tmp/hard-sentinel/spring-java}
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:127.0.0.1:8858}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:hard-dev}
            group-id: SENTINEL_GROUP
            data-id: spring-java-service-sentinel-flow.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:hard-dev}
            group-id: SENTINEL_GROUP
            data-id: spring-java-service-sentinel-degrade.json
            data-type: json
            rule-type: degrade
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: SERVICE_GROUP
        health-indicator:
          enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: HARD_GROUP
        cluster-name: LOCAL
        ip: ${SERVICE_IP:127.0.0.1}
        watch:
          enabled: true
        health-indicator:
          enabled: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacosdiscovery
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        application:
          include: ping
        mysql:
          include: db

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:--}] %logger{36} - %msg%n"

order:
  timeout:
    scan:
      enabled: true
      fixed-delay-ms: 5000
      batch-size: 100
    compensation:
      enabled: true
      fixed-delay-ms: 60000
      batch-size: 100
