server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:gateway-service.yaml?group=SERVICE_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: SERVICE_GROUP
        health-indicator:
          enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: HARD_GROUP
        cluster-name: LOCAL
        ip: ${SERVICE_IP:127.0.0.1}
        watch:
          enabled: true
        health-indicator:
          enabled: true
    loadbalancer:
      nacos:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacosdiscovery,gateway
  endpoint:
    health:
      show-components: always
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
