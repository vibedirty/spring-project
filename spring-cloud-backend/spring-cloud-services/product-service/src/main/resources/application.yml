server:
  port: ${SERVER_PORT:8103}

spring:
  application:
    name: product-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:product-service.yaml?group=SERVICE_GROUP&refreshEnabled=true
  cloud:
    sentinel:
      eager: true
      log:
        dir: ${SENTINEL_LOG_DIR:/tmp/hard-sentinel/product-service}
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:127.0.0.1:8858}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:hard-dev}
            group-id: SENTINEL_GROUP
            data-id: product-service-sentinel-flow.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:hard-dev}
            group-id: SENTINEL_GROUP
            data-id: product-service-sentinel-degrade.json
            data-type: json
            rule-type: degrade
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: SERVICE_GROUP
        health-indicator:
          enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:hard-dev}
        group: HARD_GROUP
        cluster-name: LOCAL
        ip: ${SERVICE_IP:127.0.0.1}
        watch:
          enabled: true
        health-indicator:
          enabled: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacosdiscovery
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        application:
          include: ping
        mysql:
          include: db

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:--}] %logger{36} - %msg%n"

app:
  product:
    simulation:
      delay-ms: 0
      force-error: false
