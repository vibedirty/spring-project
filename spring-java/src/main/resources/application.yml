spring:
  application:
    name: hard
  profiles:
    active: dev

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        application:
          include: ping
        mysql:
          include: db

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:--}] %logger{36} - %msg%n"

order:
  timeout:
    scan:
      enabled: true
      fixed-delay-ms: 5000
      batch-size: 100
    compensation:
      enabled: true
      fixed-delay-ms: 60000
      batch-size: 100
