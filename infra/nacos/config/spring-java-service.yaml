management:
  info:
    env:
      enabled: true

info:
  p1:
    config-source: nacos
    service-role: modular-monolith
  p3:
    account-query: openfeign-load-balanced
    governance: sentinel-nacos
  p4:
    cart-query: openfeign-load-balanced

app:
  legacy-controllers:
    account-enabled: false
    cart-enabled: false
  product:
    simulation:
      delay-ms: 0
      force-error: false
