spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=X-Request-ID Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: account-auth-api
              uri: "${ACCOUNT_UPSTREAM_URI:lb://account-service}"
              predicates:
                - Path=/api/auth/**,/api/admin/auth/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
              metadata:
                connect-timeout: 2000
                response-timeout: 10000
            - id: account-address-api
              uri: "${ACCOUNT_UPSTREAM_URI:lb://account-service}"
              predicates:
                - Path=/api/addresses,/api/addresses/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
              metadata:
                connect-timeout: 2000
                response-timeout: 10000
            - id: account-health
              uri: "${ACCOUNT_UPSTREAM_URI:lb://account-service}"
              predicates:
                - Path=/management/account-service/actuator/health,/management/account-service/actuator/health/**
              filters:
                - StripPrefix=2
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
              metadata:
                connect-timeout: 2000
            - id: cart-api
              uri: "${CART_UPSTREAM_URI:lb://cart-service}"
              predicates:
                - Path=/api/cart,/api/cart/**
              filters:
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
              metadata:
                connect-timeout: 2000
                response-timeout: 10000
            - id: cart-health
              uri: "${CART_UPSTREAM_URI:lb://cart-service}"
              predicates:
                - Path=/management/cart-service/actuator/health,/management/cart-service/actuator/health/**
              filters:
                - StripPrefix=2
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    exceptions:
                      - java.net.ConnectException
              metadata:
                connect-timeout: 2000
                response-timeout: 5000
            - id: spring-java-api
              uri: "${GATEWAY_UPSTREAM_URI:lb://spring-java-service}"
              predicates:
                - Path=/api/**
              metadata:
                connect-timeout: 2000
                response-timeout: 10000
            - id: spring-java-health
              uri: "${GATEWAY_UPSTREAM_URI:lb://spring-java-service}"
              predicates:
                - Path=/management/spring-java/actuator/health,/management/spring-java/actuator/health/**
              filters:
                - StripPrefix=2
              metadata:
                connect-timeout: 2000
                response-timeout: 5000
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                  - http://localhost:5174
                  - http://127.0.0.1:5174
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                exposed-headers:
                  - X-Request-ID
                  - X-Service-Instance
                allow-credentials: true
                max-age: 3600

management:
  info:
    env:
      enabled: true

info:
  p1:
    config-source: nacos
    route-mode: load-balanced-dynamic-refresh
  p3:
    governance: sentinel-nacos
